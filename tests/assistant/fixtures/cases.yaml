    turns:
      - user: "What was the Celtics' net rating in 2025-26, and where did it rank in the league?"
    expect:
      outcome: supported
      first_call:
        - {tool: team_stats, args: {team_id: 1610612738, season: "2025-26"}}
      facts:
        - {call: teams.table, args: {season: "2025-26"}, path: teams, row: 1610612738, column: net_rating, value: 8.3, tolerance: 0.001}
        - {call: teams.table, args: {season: "2025-26"}, path: ranks, row: 1610612738, column: net_rating, value: 4}
        - {call: teams.table, args: {season: "2025-26"}, path: teams, count: 30}
