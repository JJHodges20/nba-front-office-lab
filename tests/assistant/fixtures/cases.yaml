# The assistant's frozen evaluation cases. See docs/AI_EVALUATION.md.
#
# Each case is one question (or a short conversation) with what a correct answer must do.
# Never edit a case to make a model pass. A case is changed only when the lab's data or a
# model file changes what is true - and then the oracle test says so first - or when the
# user, reviewing a case, decides it is wrong; the development log then says which case,
# why and when, and a comment on the case says so too.
#
#   database  which test database the figures come from:
#               fixture   - the build of tests/fixtures/raw (built_readonly): real responses,
#                           team statistics for 1996-97, 2012-13 and 2025-26, player
#                           statistics for 2025-26 (Celtics and Knicks players only), no
#                           contract file, the shipped model files
#               contracts - the same build with the tests' invented contract file imported
#                           (contract_template), as of 2026-10-01
#   context   what the workbench hands the assistant with the question: the sidebar filters,
#             the names the deterministic pre-pass resolved (several candidates for one
#             name mean it is ambiguous), and any source the user supplied
#   turns     the conversation; what is scored is the model's next move after the last
#             turn. An assistant turn is a summary of an earlier answer; a tool turn is a
#             call the model made (name, arguments) and its result as the model saw it
#   expect    outcome     supported | qualified | insufficient | clarify | refuse
#             first_call  the acceptable first tool calls (args are a subset that must
#                         match); "none" means the right first move is to answer without
#                         a tool (ask, decline, or explain)
#             facts       figures a correct answer rests on, frozen here and recomputed
#                         through the services by tests/assistant/test_cases.py
#             cite        what the answer must carry: build (data build), model (model
#                         revision), interval, as_of (contract date), source (a dated link
#                         or document path), nba (an NBA.com credit for league statistics)
#             forbid      wording a correct answer must not use
#             forbid_calls / forbid_args  tools, or text inside any tool argument, that
#                         must not appear in any call

version: 1
today: "2026-10-09"
calendar: "2026-27 league year; preseason under way, no regular-season games played yet."
databases:
  fixture: >-
    Team statistics for 1996-97, 2012-13 and 2025-26; player statistics for 2025-26
    (Celtics and Knicks players only); no contract file; value model r2, postseason model
    revision 2, simulator revision 2; data build 1 of 2026-10-01.
  contracts: >-
    Team statistics for 1996-97, 2012-13 and 2025-26; player statistics for 2025-26
    (Celtics and Knicks players only); contracts for 2026-27 to 2028-29 as of 2026-10-01
    (source "invented for tests"); value model r2; data build 2 of 2026-10-01.

