# Workbench appearance and behaviour. Read when streamlit is started from the project root.
#
# The colours are the same tokens the charts use (apps/workbench/wb/theme.py): one
# palette stepped for a light and for a dark surface, so a chart and the page around it
# always agree. Change them in both places.

[theme]
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
baseFontSize = 15
baseRadius = "8px"
headingFontSizes = ["2rem", "1.4rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#fcfcfb"
blueColor = "#2a78d6"
greenColor = "#0ca30c"
orangeColor = "#ec835a"
yellowColor = "#fab219"
redColor = "#d03b3b"
violetColor = "#4a3aa7"
grayColor = "#898781"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f9f9f7"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
linkColor = "#3987e5"
borderColor = "#2c2c2a"
dataframeBorderColor = "#2c2c2a"
dataframeHeaderBackgroundColor = "#1a1a19"
blueColor = "#3987e5"
greenColor = "#0ca30c"
orangeColor = "#ec835a"
yellowColor = "#fab219"
redColor = "#d03b3b"
violetColor = "#9085e9"
grayColor = "#898781"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#0d0d0d"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[server]
# The workbench is a local tool: it listens on this machine only.
address = "localhost"
headless = true
