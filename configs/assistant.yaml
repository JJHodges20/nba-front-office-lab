# The AI research assistant: which local model answers, and within what limits.
# See docs/decisions/0018-ai-research-assistant.md and docs/AI_ASSISTANT_SPEC.md.
#
# The model runs on this machine through Ollama. The address must be the loopback one, a
# cloud model is refused, and there is no field for a key: an unknown field is an error.
# The default and fallback models were chosen by the benchmark of 2026-10-09 on this
# machine (scripts/benchmark_ollama.py, docs/research/ASSISTANT_MODELS.md, the A1 entry of
# docs/DEVELOPMENT_LOG.md); run it again before changing them. An 8,192-token context
# keeps qwen3:8b wholly on the RTX 4060 with the desktop's share in use.

version: 1

ollama:
  host: "http://127.0.0.1:11434"
  timeout_seconds: 180
  # How long Ollama keeps the model loaded after a question.
  keep_alive: "10m"

default_model: "qwen3:8b"
fallback_model: "qwen3:4b-instruct"
temperature: 0

# Quick: one fact or one comparison. Deep: several sources, with thinking.
# The context length is sent with every request, never inherited from Ollama.
quick:
  context_tokens: 8192
  think: false
  max_output_tokens: 1024
deep:
  context_tokens: 8192
  think: true
  max_output_tokens: 3072

# Current information (data/current.sqlite): how many minutes each source may age before a
# question fetches it again, and how many quarter hours back to look for the latest
# injury report. Starting values; set them from how often each source changes in season.
current:
  games_minutes: 60
  transactions_minutes: 180
  injuries_minutes: 30
  news_minutes: 30
  injury_slots: 4

# News feeds (A7): reporting read as a feed reader reads it - headlines, dates, a short
# excerpt and the link - credited to the site. Only sites docs/DATA_SOURCE_REGISTER.md
# allows: Hoops Rumors, which invites feed readers and whose robots.txt admits the lab and
# AI agents alike (the user's choice, 2026-10-10). The two general feeds are read for any
# question about news; a team's own feed when a question is about that team. Items are kept
# for keep_days after they were published. Reporting never changes the lab's data, a roster
# or the contract file.
news:
