# The lab's HTTP API (decision 0019, docs/CAPSTONE.md): `fol api`, or the `api` service of
# Docker Compose.
#
# The key that signs sign-in tokens is not kept here: it is your own, FOL_API_SECRET, from
# the environment or the git-ignored .env - or, when neither gives one, a key the API makes
# once in data/api/ and never prints. An unknown field is an error, so a key cannot be
# added to this file by mistake.

version: 1

sign_in:
  # How long a token signs its user in. After that the user signs in again.
  token_minutes: 60
  # bcrypt's cost for a new password: each step doubles the work of checking it, for the
  # API and for anyone guessing at a stolen hash. 12 takes about a quarter of a second.
  password_rounds: 12

# Asking the lab's documents (POST /rag/ask). They are cut into the passages the AI Research
# assistant's keyword search reads, embedded by a local Ollama model and kept in ChromaDB in
# data/rag (fol rag index builds it). An answer is written from the nearest passages alone,
# by the assistant's own model within its quick mode's limits (configs/assistant.yaml).
rag:
  embedding_model: "nomic-embed-text"
  # nomic-embed-text tells a passage from a question by these prefixes.
  document_prefix: "search_document: "
  query_prefix: "search_query: "
  # How many of the nearest passages one answer is given.
  passages: 5
  # Passages embedded per request while the index is built.
  batch: 32
  # Left out besides the files the keyword search leaves out: text a model or the web wrote,
  # so that an answer rests on the lab's own words - the experiment ideas a model drafted,
  # a recorded session's answers, and the web search's recorded results. Found live at C5:
  # a drafted idea was retrieved for how a model is tested, and the answer repeated it.
  left_out:
    - docs/research/EXPERIMENT_PROPOSALS.md
    - docs/research/ASSISTANT_SESSION.md
    - docs/research/SEARCH_QUALITY.md
