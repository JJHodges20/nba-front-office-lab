# The lab's HTTP API (decision 0019, docs/CAPSTONE.md): `fol api`, or the `api` service of
# Docker Compose.
#
# The key that signs sign-in tokens is not kept here: it is your own, FOL_API_SECRET, from
# the environment or the git-ignored .env - or, when neither gives one, a key the API makes
# once in data/api/ and never prints. An unknown field is an error, so a key cannot be
# added to this file by mistake.

version: 1

sign_in:
  # How long a token signs its user in. After that the user signs in again.
  token_minutes: 60
  # bcrypt's cost for a new password: each step doubles the work of checking it, for the
  # API and for anyone guessing at a stolen hash. 12 takes about a quarter of a second.
  password_rounds: 12
