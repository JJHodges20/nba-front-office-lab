# Salary-cap and roster rules for the 2025-26 NBA season.
# All amounts are whole US dollars. Verify against the sources below before changing.
season: "2025-26"
status: final   # set by the league on June 30, 2025; in effect from July 1, 2025

thresholds:
  salary_cap: 154647000
  minimum_team_salary: 139182000
  luxury_tax: 187895000
  first_apron: 195945000
  second_apron: 207824000

exceptions:
  non_taxpayer_mid_level: 14104000
  taxpayer_mid_level: 5685000
  room_mid_level: 8781000
  bi_annual: 5134000

# Maximum first-year salary by years of service (25% / 30% / 35% of the cap).
maximum_salaries:
  service_0_to_6_years: 38661750
  service_7_to_9_years: 46394100
  service_10_plus_years: 54126450

roster:
  max_standard_contracts: 15
  min_standard_contracts: 14
  max_two_way_contracts: 3
  offseason_max_players: 21

sources:
  - publisher: NBA
    title: "NBA Salary Cap for 2025-26 season set at $154.647 million"
    url: "https://pr.nba.com/nba-salary-cap-2025-26-season"
    published: 2025-06-30
    retrieved: 2026-10-01
    covers: "Cap, tax level, minimum team salary, both aprons and the three mid-level exceptions."
  - publisher: Hoops Rumors
    title: "Salary Cap, Tax Line Set For 2025/26 NBA Season"
    url: "https://www.hoopsrumors.com/2025/06/salary-cap-tax-line-set-for-2025-26-nba-season.html"
    published: 2025-06-30
    retrieved: 2026-10-01
    covers: "Bi-annual exception and maximum salaries, which the NBA release does not list."
  - publisher: NBA
    title: "CBA 101 - Highlights of the Collective Bargaining Agreement"
    url: "https://cms.nba.com/wp-content/uploads/sites/4/2024/11/2024-25-CBA-101.pdf"
    retrieved: 2026-10-01
    covers: "Roster limits: 14-15 standard contracts in season, up to three two-way contracts, 21 players in the offseason."

notes: >
  A team may carry 12 or 13 standard contracts for at most two consecutive weeks at a
  time and 28 days in total during a regular season; min_standard_contracts records the
  general requirement of 14.
