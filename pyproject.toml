[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-front-office-lab"
version = "0.1.0"
description = "Front-office research workbench: NBA analytics, contracts, cap rules, and roster construction."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joshua Hodges" }]
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6",
    "nba_api>=1.9",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13",
    "streamlit>=1.64",
    "plotly>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3", "ruff>=0.4"]

[project.scripts]
fol = "front_office.interfaces.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "apps/workbench"]
# worksteal: with -n, an idle worker takes queued tests from a busy one. The page sweeps
# run for half a minute each, and the default hands them out in batches that pile up.
addopts = "-q -m 'not network' --dist worksteal"
markers = [
    "network: calls a live external service; deselected by default (run with -m network)",
]
# A warning is a defect we have not looked at yet. Add a targeted ignore here, with a
# reason, only for warnings raised inside third-party code.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps/workbench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
